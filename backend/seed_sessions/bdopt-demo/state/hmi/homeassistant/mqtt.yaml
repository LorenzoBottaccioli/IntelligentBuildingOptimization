climate:
  - name: "Thermostat"
    device:
      identifiers:
        - "demo_zone_west"
      name: "West"
      manufacturer: "Demo building"
      model: "Heating zone"
      suggested_area: "West zone"
    unique_id: "demo_thermostat_west"
    default_entity_id: "climate.west_thermostat"
    current_temperature_topic: "demo/controlled/temperature_west"
    current_temperature_template: "{{ value_json.value }}"
    temperature_state_topic: "demo/controlled/setpoint/west"
    temperature_state_template: "{{ value_json.value }}"
    temperature_command_topic: "demo/controlled/cmd/west"
    temperature_command_template: "{\"value\": {{ value | float }}}"
    modes:
      - "heat"
    mode_state_topic: "demo/site/run"
    mode_state_template: "heat"
    min_temp: 10
    max_temp: 30
    temp_step: 1
    precision: 0.1
