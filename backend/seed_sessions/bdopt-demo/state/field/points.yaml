# points.yaml -- configuration of the platform's EMERGENCY gateway.
#
# Generated by the platform at every FMU export (it is overwritten each time):
# it is NOT student work. The platform's emergency gateway reads it to run the
# building with default commands when the teacher raises the emergency flag.
# Students configure their own devices in Workspace/devices/gateway.py.
#
#   site.name / site.year         building name and the real year of the timestamps
#   gateway.sync_timeout_s        max wait for the controller ack in sync mode
#   gateway.command_timeout_steps a command expires after N steps
#   gateway.heartbeat_steps       republish an unchanged value every N steps
#
#   id        snake_case name derived from the FMU variable
#   fmu       FMU variable name
#   type      measurement | command
#   role      observation | reward (from the FMU roles)
#   unit      engineering unit (from the model; "-" plus a TODO comment when unknown)
#   scale/offset    value = fmu*scale+offset (1 and 0)
#   deadband  a measurement is published only when it moved more than this
#   min/max   command limits (from the FMU roles or the schedule type limits)
#   default   the value applied when nobody commands the point (Initial Value)
#   A "# min: TODO (not known from the model)" comment marks a value the model
#   does not define.

site: {name: "test", year: 2026}
gateway: {sync_timeout_s: 5, command_timeout_steps: 3, heartbeat_steps: 6}
points:
  - id: district_heating_facility
    fmu: "DistrictHeating_Facility"
    type: measurement
    role: observation
    unit: "J"
    scale: 1
    offset: 0
    deadband: 0.1
  - id: electricity_facility
    fmu: "Electricity_Facility"
    type: measurement
    role: observation
    unit: "J"
    scale: 1
    offset: 0
    deadband: 0.1
  - id: zone_air_temperature_zonewest
    fmu: "Zone_Air_Temperature_ZONEWEST"
    type: measurement
    role: observation
    unit: "degC"
    scale: 1
    offset: 0
    deadband: 0.1
  - id: zone_air_temperature_zonesouth
    fmu: "Zone_Air_Temperature_ZONESOUTH"
    type: measurement
    role: observation
    unit: "degC"
    scale: 1
    offset: 0
    deadband: 0.1
  - id: zone_air_temperature_zoneeast
    fmu: "Zone_Air_Temperature_ZONEEAST"
    type: measurement
    role: observation
    unit: "degC"
    scale: 1
    offset: 0
    deadband: 0.1
  - id: zone_air_temperature_zonenorth
    fmu: "Zone_Air_Temperature_ZONENORTH"
    type: measurement
    role: observation
    unit: "degC"
    scale: 1
    offset: 0
    deadband: 0.1
  - id: site_outdoor_air_drybulb_temperature_environment
    fmu: "Site_Outdoor_Air_Drybulb_Temperature_Environment"
    type: measurement
    role: observation
    unit: "degC"
    scale: 1
    offset: 0
    deadband: 0.1
  - id: site_outdoor_air_relative_humidity_environment
    fmu: "Site_Outdoor_Air_Relative_Humidity_Environment"
    type: measurement
    role: observation
    unit: "%"
    scale: 1
    offset: 0
    deadband: 0.1
  - id: site_wind_speed_environment
    fmu: "Site_Wind_Speed_Environment"
    type: measurement
    role: observation
    unit: "m/s"
    scale: 1
    offset: 0
    deadband: 0.1
  - id: site_direct_solar_radiation_rate_per_area_environment
    fmu: "Site_Direct_Solar_Radiation_Rate_per_Area_Environment"
    type: measurement
    role: observation
    unit: "W/m2"
    scale: 1
    offset: 0
    deadband: 0.1
  - id: zonewest_heating_setpoint_fmu
    fmu: "ZONEWEST_Heating_Setpoint_FMU"
    type: command
    unit: "-"   # TODO (not known from the model)
    min: 10
    max: 30
    default: 12
  - id: zonesouth_heating_setpoint_fmu
    fmu: "ZONESOUTH_Heating_Setpoint_FMU"
    type: command
    unit: "-"   # TODO (not known from the model)
    min: 10
    max: 30
    default: 12
  - id: zoneeast_heating_setpoint_fmu
    fmu: "ZONEEAST_Heating_Setpoint_FMU"
    type: command
    unit: "-"   # TODO (not known from the model)
    min: 10
    max: 30
    default: 12
  - id: zonenorth_heating_setpoint_fmu
    fmu: "ZONENORTH_Heating_Setpoint_FMU"
    type: command
    unit: "-"   # TODO (not known from the model)
    min: 10
    max: 30
    default: 12
