server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Si la ruta solicitada no existe, devolvemos index.html (para rutas de SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html names the bundle of this build. Without Cache-Control the
    # browser caches it heuristically and keeps loading the previous bundle
    # after a rebuild, so it is always revalidated.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Vite puts a content hash in every asset name: a new build is a new URL.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # (Opcional) Si en producción quieres que /api/* apunte al contenedor backend:
    # location /api/ {
    #     proxy_pass http://backend:5000/api/;
    # }
}
