name: conda_environment
channels:
  - conda-forge
  - defaults

dependencies:
  # ---- core (TF 2.7 compat) ----
  - python=3.9
  - pip
  - numpy=1.21.6
  - pandas=1.3.5
  - scipy=1.7.3

  # ---- conda pkgs “neutri” (no matplotlib qui!) ----
  - lxml
  - cython
  - wxpython
  - pyfmi
  - assimulo
  - scikit-learn
  - networkx
  - paho-mqtt
  - influxdb-client
  - shapely

  - pip:
      # toolchain pip/jupyter legacy compat
      - "pip<24.1"
      - "setuptools<70"

      # >>> QUI matplotlib 3.2.2 via pip (build da sorgente su py39)
      - matplotlib==3.2.2
      - matplotlib-inline==0.1.3

      # Jupyter classic stabile
      - notebook==6.5.7
      - jupyter-client==7.3.4
      - jupyter-console==6.4.4
      - jupyter-core==4.11.1
      - jupyter-server==1.18.1
      - jupyterlab-pygments==0.2.2
      - jupyterlab-widgets==1.1.1
      - ipykernel

      # RL stack (py3.9 + numpy 1.21)
      - gymnasium==1.0.0
      - stable_baselines3==2.4.1
      - torch==2.4.*

      # BESOS fisso + dipendenze collaudate
      - besos==2.1.3
      - "geomeppy @ git+https://github.com/jamiebull1/geomeppy"
      - dask[complete]==2022.10.2
      - distributed==2022.10.2
      - pyomo>=6.7
      - eppy>=0.5.60

      # TensorFlow CPU (richiesto)
      - tensorflow==2.7.0
